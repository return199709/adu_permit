name: Build sample drawing set
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the sample project and run the checks
        run: python run.py examples/sample_house
      - uses: actions/upload-artifact@v4
        with:
          name: sample-drawing-set
          path: examples/sample_house/output/
